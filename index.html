    <script>
      (function () {
        try {
          var patchFetchDescriptor = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && (desc.get || desc.writable === false) && desc.configurable !== false) {
              var currentFetch = typeof target.fetch === 'function' ? target.fetch.bind( window ) : window.fetch;
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (nextFetch) {
                  if (typeof nextFetch === 'function') {
                    currentFetch = nextFetch;
                  }
                },
              });
            }
          };
          patchFetchDescriptor(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchFetchDescriptor(Window.prototype);
          }
        } catch (_err) {
          // Ignore descriptor lock errors
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var src = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reasonStr = String((event && event.reason && (event.reason.message || event.reason)) || '');
            var stackStr = String((event && event.reason && event.reason.stack) || '');
            if (
              reasonStr.indexOf('Cannot set property fetch') !== -1 ||
              stackStr.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
